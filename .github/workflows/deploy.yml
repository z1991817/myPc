name: Deploy Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is empty"; exit 1; }
          test -n "$DEPLOY_PORT" || { echo "DEPLOY_PORT is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is empty"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is empty"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is empty"; exit 1; }

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          request_pty: true
          script: |
            set -e

            load_profile() {
              profile="$1"
              if [ -f "$profile" ]; then
                echo "[deploy] loading $profile"
                set +eu
                . "$profile"
                status=$?
                set -eu
                if [ "$status" -ne 0 ]; then
                  echo "[deploy] warning: $profile exited with status $status"
                fi
              fi
            }

            echo "[deploy] preparing shell environment"
            load_profile /etc/profile
            load_profile "$HOME/.bash_profile"
            load_profile "$HOME/.bashrc"
            load_profile "$HOME/.profile"

            export PATH="$HOME/.local/share/pnpm:/usr/local/bin:/usr/bin:$PATH"

            echo "[deploy] checking runtime"
            command -v node || { echo "[deploy] node not found"; exit 1; }
            command -v pnpm || { echo "[deploy] pnpm not found"; exit 1; }
            command -v pm2 || { echo "[deploy] pm2 not found"; exit 1; }
            node -v
            pnpm -v
            pm2 -v

            echo "[deploy] entering project"
            cd "${{ secrets.DEPLOY_PATH }}"
            pwd

            BRANCH="${{ github.ref_name }}"
            if [ -z "$BRANCH" ]; then
              BRANCH="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')"
            fi
            if [ -z "$BRANCH" ]; then
              BRANCH="master"
            fi

            echo "[deploy] syncing git branch $BRANCH"
            git fetch origin "$BRANCH"
            git switch "$BRANCH" || git switch -c "$BRANCH" --track "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd

            echo "[deploy] installing dependencies"
            pnpm install --frozen-lockfile

            echo "[deploy] cleaning old build cache"
            rm -rf .next

            echo "[deploy] building app"
            pnpm build

            echo "[deploy] clearing nginx proxy cache"
            rm -rf /www/server/nginx/proxy_cache_dir/*

            echo "[deploy] restarting pm2 app"
            pm2 restart next-pages-template || pm2 start ecosystem.config.cjs --only next-pages-template
            pm2 save

            echo "[deploy] reloading nginx"
            nginx -s reload

            echo "[deploy] deployment completed"
