name: Deploy Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is empty"; exit 1; }
          test -n "$DEPLOY_PORT" || { echo "DEPLOY_PORT is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is empty"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is empty"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is empty"; exit 1; }

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          script: |
            set -e
            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.bash_profile" ] && . "$HOME/.bash_profile"
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"

            export PATH="$HOME/.local/share/pnpm:/usr/local/bin:/usr/bin:$PATH"

            if ! command -v pnpm >/dev/null 2>&1; then
              echo "pnpm not found in PATH after loading profiles"
              exit 1
            fi

            command -v pnpm
            pnpm -v

            cd "${{ secrets.DEPLOY_PATH }}"
            BRANCH="${{ github.ref_name }}"
            git fetch origin "$BRANCH"
            git switch "$BRANCH" || git switch -c "$BRANCH" --track "origin/$BRANCH"
            git pull origin "$BRANCH"
            pnpm install --frozen-lockfile
            pnpm build
            pm2 reload next-pages-template || pm2 start ecosystem.config.cjs --only next-pages-template
            pm2 save
